<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" fill="none" role="img" aria-label="PROJECT DUME - a JARVIS style voice assistant">
  <defs>
    <radialGradient id="bg" cx="50%" cy="46%" r="70%">
      <stop offset="0%" stop-color="#0b1626"/>
      <stop offset="55%" stop-color="#070b13"/>
      <stop offset="100%" stop-color="#05070c"/>
    </radialGradient>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#bfe9ff"/>
      <stop offset="35%" stop-color="#54d6ff"/>
      <stop offset="70%" stop-color="#1a86c4"/>
      <stop offset="100%" stop-color="#0b2740" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#eaf6ff"/>
      <stop offset="55%" stop-color="#8fe3ff"/>
      <stop offset="100%" stop-color="#54d6ff"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
  </defs>

  <rect width="1200" height="400" fill="url(#bg)"/>
  <!-- faint grid -->
  <g stroke="#1a2c42" stroke-width="1" opacity="0.35">
    <path d="M0 80 H1200 M0 160 H1200 M0 240 H1200 M0 320 H1200"/>
    <path d="M120 0 V400 M360 0 V400 M600 0 V400 M840 0 V400 M1080 0 V400"/>
  </g>

  <!-- the reactive core, centred on the left third -->
  <g transform="translate(300 200)">
    <!-- glow halo -->
    <circle r="150" fill="url(#core)" filter="url(#soft)" opacity="0.8">
      <animate attributeName="opacity" values="0.55;0.9;0.55" dur="3.6s" repeatCount="indefinite"/>
    </circle>

    <!-- breathing rings -->
    <circle r="70" fill="none" stroke="#54d6ff" stroke-width="2" opacity="0.9">
      <animate attributeName="r" values="66;78;66" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.9;0.4;0.9" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle r="96" fill="none" stroke="#54d6ff" stroke-width="1.5" opacity="0.5">
      <animate attributeName="r" values="92;104;92" dur="3.2s" begin="-1s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.15;0.5" dur="3.2s" begin="-1s" repeatCount="indefinite"/>
    </circle>

    <!-- rotating dashed orbit rings (tilted) -->
    <g opacity="0.75">
      <ellipse rx="118" ry="118" fill="none" stroke="#54d6ff" stroke-width="1.5" stroke-dasharray="4 10" opacity="0.6">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="18s" repeatCount="indefinite"/>
      </ellipse>
      <ellipse rx="135" ry="58" fill="none" stroke="#8fe3ff" stroke-width="1.5" stroke-dasharray="2 9">
        <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="22s" repeatCount="indefinite"/>
      </ellipse>
      <ellipse rx="58" ry="135" fill="none" stroke="#3fb8ef" stroke-width="1.5" stroke-dasharray="2 9">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="26s" repeatCount="indefinite"/>
      </ellipse>
    </g>

    <!-- orbiting particles -->
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="14s" repeatCount="indefinite"/>
      <circle cx="118" cy="0" r="3" fill="#bfe9ff"/>
      <circle cx="-118" cy="0" r="2" fill="#54d6ff"/>
      <circle cx="0" cy="128" r="2.5" fill="#8fe3ff"/>
    </g>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="20s" repeatCount="indefinite"/>
      <circle cx="140" cy="20" r="2" fill="#54d6ff"/>
      <circle cx="-130" cy="-30" r="2.5" fill="#bfe9ff"/>
    </g>

    <!-- solid core -->
    <circle r="46" fill="url(#core)" filter="url(#glow)">
      <animate attributeName="r" values="44;49;44" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <circle r="22" fill="#eaf6ff" opacity="0.95">
      <animate attributeName="opacity" values="0.8;1;0.8" dur="1.8s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- title block -->
  <g transform="translate(540 150)">
    <text x="0" y="0" font-family="'Segoe UI',Verdana,sans-serif" font-size="68" font-weight="700" letter-spacing="10" fill="url(#title)" filter="url(#glow)">PROJECT·DUME</text>
    <text x="4" y="46" font-family="'Consolas','Courier New',monospace" font-size="20" letter-spacing="5" fill="#7f93ab">A&#160;VOICE&#160;&amp;&#160;SCREEN&#160;ASSISTANT&#160;WITH&#160;A&#160;CLAUDE&#160;MIND</text>

    <!-- animated status line -->
    <g transform="translate(4 92)" font-family="'Consolas','Courier New',monospace" font-size="15" fill="#54d6ff">
      <circle cx="6" cy="-5" r="5" fill="#54d6ff">
        <animate attributeName="opacity" values="1;0.25;1" dur="1.6s" repeatCount="indefinite"/>
      </circle>
      <text x="22" y="0" fill="#9fb6cc">
        <tspan>listening</tspan>
        <animate attributeName="opacity" values="0;1;1;0;0;0;0" dur="6s" repeatCount="indefinite"/>
      </text>
      <text x="22" y="0" fill="#b48cff">
        <tspan>thinking</tspan>
        <animate attributeName="opacity" values="0;0;0;1;1;0;0" dur="6s" repeatCount="indefinite"/>
      </text>
      <text x="22" y="0" fill="#67e8ff">
        <tspan>speaking</tspan>
        <animate attributeName="opacity" values="0;0;0;0;0;1;1;0" dur="6s" repeatCount="indefinite"/>
      </text>
    </g>

    <!-- waveform -->
    <g transform="translate(200 80)" fill="#54d6ff">
      <rect x="0"  y="-6"  width="4" height="12" rx="2"><animate attributeName="height" values="8;26;8" dur="0.9s" repeatCount="indefinite"/><animate attributeName="y" values="-4;-13;-4" dur="0.9s" repeatCount="indefinite"/></rect>
      <rect x="10" y="-10" width="4" height="20" rx="2"><animate attributeName="height" values="20;34;12;20" dur="1.1s" repeatCount="indefinite"/><animate attributeName="y" values="-10;-17;-6;-10" dur="1.1s" repeatCount="indefinite"/></rect>
      <rect x="20" y="-14" width="4" height="28" rx="2"><animate attributeName="height" values="28;10;28" dur="0.8s" repeatCount="indefinite"/><animate attributeName="y" values="-14;-5;-14" dur="0.8s" repeatCount="indefinite"/></rect>
      <rect x="30" y="-9"  width="4" height="18" rx="2"><animate attributeName="height" values="14;30;14" dur="1s" repeatCount="indefinite"/><animate attributeName="y" values="-7;-15;-7" dur="1s" repeatCount="indefinite"/></rect>
      <rect x="40" y="-6"  width="4" height="12" rx="2"><animate attributeName="height" values="10;24;10" dur="0.95s" repeatCount="indefinite"/><animate attributeName="y" values="-5;-12;-5" dur="0.95s" repeatCount="indefinite"/></rect>
      <rect x="50" y="-12" width="4" height="24" rx="2"><animate attributeName="height" values="24;8;24" dur="1.05s" repeatCount="indefinite"/><animate attributeName="y" values="-12;-4;-12" dur="1.05s" repeatCount="indefinite"/></rect>
      <rect x="60" y="-8"  width="4" height="16" rx="2"><animate attributeName="height" values="16;30;16" dur="0.85s" repeatCount="indefinite"/><animate attributeName="y" values="-8;-15;-8" dur="0.85s" repeatCount="indefinite"/></rect>
    </g>
  </g>
</svg>
